name: Rollback Container App

# Manual trigger only: someone must click "Run workflow" and fill the form.
# This is a caller for testing the shared rollback from mastec-ops itself.
# Each service repo gets its own copy of this file, with its own containers.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      resource_group:
        description: "Resource group of the Container Apps (example: qwest-dev-rg)"
        required: true
        type: string
      containers:
        description: >-
          JSON array: [{"app": "...", "digest": "registry/repo@sha256:..."}].
          One entry for a single-container repo. One entry per container for a
          repo with sidecars. Order is the order of change: beat, worker, web.
        required: true
        type: string
      smoke_test_url:
        description: "HTTPS health-check URL of the service (its web app)"
        required: true
        type: string

# Needed so the called workflow can request an OIDC token for Azure login.
permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    # Calls the shared rollback workflow in the mastec-ops repo.
    # Path = <org>/<repo>/<file path>@<ref>.
    # @main is temporary for dev testing; pin to a full commit SHA for prod.
    uses: Mastec-Quadgen-AzureApps/mastec-ops/.github/workflows/rollback-container-app.yaml@main
    with:
      environment: ${{ inputs.environment }}
      resource_group: ${{ inputs.resource_group }}
      # ONE CONTAINER (for example qwest_users): one entry.
      #   containers: '[{"app": "qwest-users-dev", "digest": "qwestdevacr1.azurecr.io/qwest-users@sha256:..."}]'
      #
      # SIDECARS (for example qwest_requests): one entry per container, beat first.
      containers: >-
        [
          {"app": "qwest-requests-beat-dev",   "digest": "qwestdevacr1.azurecr.io/qwest-requests-beat@sha256:..."},
          {"app": "qwest-requests-worker-dev", "digest": "qwestdevacr1.azurecr.io/qwest-requests-worker@sha256:..."},
          {"app": "qwest-requests-dev",        "digest": "qwestdevacr1.azurecr.io/qwest-requests@sha256:..."}
        ]
      smoke_test_url: ${{ inputs.smoke_test_url }}
    # Passes the secrets of the repo running this caller (AZURE_CLIENT_ID,
    # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) to the reusable workflow.
    # Secrets are not stored in mastec-ops. Whether environment-level secrets
    # also arrive is unverified; see APPROACH.md, open questions.
    secrets: inherit
