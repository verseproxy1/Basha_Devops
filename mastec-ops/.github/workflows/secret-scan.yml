# Reusable workflow: scan the caller repo for committed secrets with gitleaks.
# Called by a service repo's caller workflow with `uses:`.
#
# The scan runs on the server, so it can't be skipped by a developer who hasn't
# installed the local hook. Make this check required in the organization ruleset
# for protected branches, so a failing scan blocks the merge.

name: Secret scan (shared)

on:
  workflow_call:
    inputs:
      shared_ref:
        description: "mastec-ops branch, tag or commit holding the gitleaks config"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: [self-hosted, linux, x64]
    steps:
      # Full history, so secrets committed earlier in a branch are found too.
      - name: Check out caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out central gitleaks config from mastec-ops
        uses: actions/checkout@v4
        with:
          repository: Mastec-Quadgen-AzureApps/mastec-ops
          ref: ${{ inputs.shared_ref }}
          path: shared

      # The gitleaks image is pinned to a version. Upgrade it deliberately, not
      # on every run.
      - name: Run gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$GITHUB_WORKSPACE/shared/gitleaks:/config:ro" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --config /config/.gitleaks.toml --redact --verbose
